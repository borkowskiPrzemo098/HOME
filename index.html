<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moje Projekty</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c5cff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z'/%3E%3Cpath d='M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z'/%3E%3Cpath d='M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0'/%3E%3Cpath d='M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1220;
    --bg2:#161a2e;
    --card:#1c2138;
    --card2:#232a48;
    --accent:#7c5cff;
    --accent2:#ff5c9e;
    --accent3:#4ce0d2;
    --text:#f2f2fb;
    --text-dim:#9a9fc0;
    --border:rgba(255,255,255,0.08);
    --shadow:rgba(0,0,0,0.5);
    --nav-bg:rgba(20,22,40,0.85);
    --success:#4ce0a0;
    --glass-bg:rgba(255,255,255,0.08);
    --glass-bg-strong:rgba(255,255,255,0.14);
    --glass-border:rgba(255,255,255,0.35);
    --glass-shine:rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  .glass{
    position:relative;
    background:
      linear-gradient(155deg, var(--glass-bg-strong) 0%, var(--glass-bg) 55%, rgba(255,255,255,0.03) 100%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .glass::before{
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:44%;
    border-radius:999px 999px 60% 60% / 100% 100% 20% 20%;
    background:linear-gradient(180deg, var(--glass-shine), rgba(255,255,255,0) 100%);
    opacity:0.35;
    pointer-events:none;
  }
  .glass:active{ transform:scale(0.96); }
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(circle at 20% -10%, rgba(124,92,255,0.25), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(255,92,158,0.15), transparent 40%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:110px;
    overflow-x:hidden;
  }
  svg.icon{ width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0; }

  header.top{
    padding:26px 20px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:5;
    background:linear-gradient(180deg, var(--bg) 60%, rgba(15,18,32,0));
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  header.top .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  header.top .brand-ic{
    width:34px; height:34px;
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    box-shadow:0 8px 18px rgba(124,92,255,0.4);
    color:#fff;
    font-size:1.15rem;
  }
  header.top h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:0.5px;
  }
  header.top p{margin:6px 0 0; color:var(--text-dim); font-size:0.85rem;}

  .tabs{
    display:flex;
    gap:10px;
    padding:16px 20px 8px;
    max-width:640px;
    margin:0 auto;
  }
  .tab-btn{
    flex:1;
    min-width:0;
    padding:11px 4px 10px;
    border-radius:16px;
    color:var(--text);
    font-size:0.68rem;
    font-weight:700;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .tab-btn svg.icon{width:19px; height:19px;}
  .tab-btn.active{
    background:
      linear-gradient(155deg, rgba(124,92,255,0.55) 0%, rgba(124,92,255,0.28) 55%, rgba(124,92,255,0.12) 100%);
    border-color:rgba(124,92,255,0.6);
    box-shadow:
      0 10px 28px rgba(124,92,255,0.45),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -1px 0 rgba(255,255,255,0.08);
    transform:translateY(-2px);
  }
  .tab-btn:active{transform:scale(0.96);}

  main{
    max-width:640px;
    margin:0 auto;
    padding:8px 20px 20px;
  }

  .section-label{
    color:var(--text-dim);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:18px 4px 10px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .section-label svg.icon{width:14px; height:14px;}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (min-width:480px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
  }

  .card{
    position:relative;
    border-radius:20px;
    padding:18px 14px;
    min-height:130px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:linear-gradient(155deg,var(--card2) 0%, var(--card) 100%);
    border:1px solid var(--border);
    box-shadow:
      0 14px 30px var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -12px 20px -14px rgba(0,0,0,0.6);
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s ease;
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    animation:pop .35s ease backwards;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.10), transparent 55%);
    pointer-events:none;
  }
  .card:active{
    transform:scale(0.95) translateY(2px);
    box-shadow:0 6px 14px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card .icon-wrap{
    width:42px; height:42px;
    border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
  }
  .card.app .icon-wrap{ color:var(--accent3); }
  .card.site .icon-wrap{ color:var(--accent2); }
  .card .icon-wrap svg.icon{ width:22px; height:22px; }
  .card .name{
    font-weight:700;
    font-size:0.98rem;
    line-height:1.25;
    margin-top:10px;
    word-break:break-word;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card:focus-visible{ outline:2px solid var(--accent3); outline-offset:2px; }
  .card .cat{
    margin-top:6px;
    font-size:0.68rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .card .del{
    position:absolute;
    top:2px;
    right:2px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:transparent;
    color:#ff5c6e;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .card .del::before{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    background:rgba(255,92,110,0.15);
    border:1px solid rgba(255,92,110,0.3);
  }
  .card .del svg.icon{width:13px; height:13px; position:relative;}
  .card.app{border-top:3px solid var(--accent3);}
  .card.site{border-top:3px solid var(--accent2);}

  @keyframes pop{
    from{opacity:0; transform:translateY(14px) scale(0.92);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .empty{
    text-align:center;
    color:var(--text-dim);
    padding:50px 20px;
    font-size:0.95rem;
  }
  .empty .big{
    width:64px; height:64px;
    margin:0 auto 14px;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .empty .big svg.icon{width:30px; height:30px;}

  /* Bottom nav — pływający szklany pasek w stylu Apple */
  nav.bottom{
    position:fixed;
    left:8px; right:8px; bottom:calc(10px + env(safe-area-inset-bottom));
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 6px;
    gap:2px;
    border-radius:28px;
    background:
      linear-gradient(155deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.06) 55%, rgba(255,255,255,0.02) 100%),
      var(--nav-bg);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 14px 34px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(255,255,255,0.05);
  }
  .nav-item{
    background:none;
    border:none;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:0.6rem;
    font-weight:600;
    padding:6px 4px;
    border-radius:14px;
    cursor:pointer;
    flex:1;
    min-width:0;
    max-width:76px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:color .15s, background .15s, transform .15s;
  }
  .nav-item svg.icon{width:20px; height:20px;}
  .nav-item.active{color:var(--text); background:rgba(124,92,255,0.18);}
  .nav-item:active{transform:scale(0.9);}

  .fab{
    position:relative;
    width:58px; height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.45);
    background:
      linear-gradient(155deg, rgba(255,255,255,0.35) 0%, rgba(124,92,255,0.85) 40%, rgba(255,92,158,0.85) 100%);
    -webkit-backdrop-filter:blur(10px) saturate(180%);
    backdrop-filter:blur(10px) saturate(180%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
      0 12px 28px rgba(124,92,255,0.55),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -2px 4px rgba(0,0,0,0.15);
    cursor:pointer;
    transform:translateY(-18px);
    transition:transform .15s;
    flex-shrink:0;
    overflow:hidden;
  }
  .fab::before{
    content:"";
    position:absolute;
    top:2px; left:12%; right:12%;
    height:40%;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0));
    pointer-events:none;
  }
  .fab svg.icon{width:26px; height:26px; stroke-width:2.4; position:relative;}
  .fab:active{transform:translateY(-18px) scale(0.9);}

  /* Modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(5,6,14,0.7);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%;
    max-width:520px;
    max-height:88vh;
    overflow-y:auto;
    background:linear-gradient(160deg,var(--bg2),var(--bg));
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:22px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -20px 60px rgba(0,0,0,0.6);
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet h2{margin:0 0 16px; font-size:1.15rem; display:flex; align-items:center; gap:9px;}
  .sheet h2 svg.icon{width:19px; height:19px; color:var(--accent);}
  .sheet .handle{
    width:40px; height:4px; border-radius:4px;
    background:var(--border); margin:0 auto 16px;
  }
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.78rem; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
  .field input, .field select{
    width:100%;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:16px; /* min. 16px zapobiega auto-zoomowi Safari na iOS przy focusie */
    outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .type-toggle{display:flex; gap:10px;}
  .type-toggle button{
    flex:1;
    padding:12px;
    border-radius:14px;
    color:var(--text-dim);
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:0.9rem;
    transition:background .2s ease, color .15s ease;
  }
  .type-toggle button svg.icon{width:16px; height:16px;}
  .type-toggle button.sel{
    background:
      linear-gradient(155deg, rgba(124,92,255,0.6) 0%, rgba(124,92,255,0.3) 60%, rgba(124,92,255,0.14) 100%);
    color:#fff;
    border-color:rgba(124,92,255,0.6);
  }
  .icon-row{display:flex; gap:8px; flex-wrap:wrap;}
  .icon-row button{
    width:44px; height:44px;
    border-radius:12px;
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .15s ease;
  }
  .icon-row button svg.icon{width:20px; height:20px; position:relative;}
  .icon-row button.sel{border-color:rgba(76,224,210,0.6); background:linear-gradient(155deg, rgba(76,224,210,0.35), rgba(76,224,210,0.1)); color:var(--accent3);}
  .save-btn{
    position:relative;
    width:100%;
    padding:15px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.4);
    background:
      linear-gradient(155deg, rgba(255,255,255,0.3) 0%, rgba(124,92,255,0.85) 35%, rgba(255,92,158,0.85) 100%);
    -webkit-backdrop-filter:blur(10px) saturate(180%);
    backdrop-filter:blur(10px) saturate(180%);
    color:#fff;
    font-weight:800;
    font-size:1rem;
    margin-top:6px;
    cursor:pointer;
    box-shadow:
      0 10px 24px rgba(124,92,255,0.4),
      inset 0 1px 0 rgba(255,255,255,0.65),
      inset 0 -2px 4px rgba(0,0,0,0.15);
    display:flex; align-items:center; justify-content:center; gap:8px;
    overflow:hidden;
  }
  .save-btn svg.icon{width:17px; height:17px; position:relative;}
  .save-btn:active{transform:scale(0.97);}
  .cancel-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:var(--text-dim);
    font-size:0.85rem;
    background:none; border:none; width:100%;
  }
  .toast{
    position:fixed;
    bottom:100px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:14px;
    font-size:0.85rem;
    opacity:0;
    transition:opacity .25s, transform .25s;
    z-index:60;
    box-shadow:0 10px 24px var(--shadow);
    display:flex; align-items:center; gap:8px;
  }
  .toast svg.icon{width:15px; height:15px; color:var(--success);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <symbol id="ic-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></symbol>
  <symbol id="ic-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6l-6.4 6.4a1.4 1.4 0 0 0 2 2l6.4-6.4a4 4 0 0 0 5.6-5.6l-2.5 2.5-2-2z"/></symbol>
  <symbol id="ic-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5-9 9"/></symbol>
  <symbol id="ic-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="18" x2="9" y2="22"/><line x1="15" y1="18" x2="15" y2="22"/><line x1="2" y1="9" x2="6" y2="9"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="22" y2="9"/><line x1="18" y1="15" x2="22" y2="15"/></symbol>
  <symbol id="ic-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="ic-gamepad" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><line x1="7" y1="10.5" x2="7" y2="14.5"/><line x1="5" y1="12.5" x2="9" y2="12.5"/><circle cx="15" cy="10.5" r="1"/><circle cx="18" cy="13.5" r="1"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
</defs>
</svg>

<header class="top">
  <div class="brand">
    <span class="brand-ic"><svg class="icon" width="18" height="18"><use href="#ic-rocket"/></svg></span>
    <h1>Moje Projekty</h1>
  </div>
  <p>Wszystkie strony i aplikacje w jednym miejscu</p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn glass active" data-tab="all"><svg class="icon"><use href="#ic-grid"/></svg> Wszystko</button>
    <button class="tab-btn glass" data-tab="app"><svg class="icon"><use href="#ic-smartphone"/></svg> Aplikacje</button>
    <button class="tab-btn glass" data-tab="site"><svg class="icon"><use href="#ic-globe"/></svg> Strony</button>
  </div>

  <div id="content"></div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="handle"></div>
    <h2><svg class="icon"><use href="#ic-plus"/></svg> Nowy projekt</h2>
    <div class="field">
      <label>Typ</label>
      <div class="type-toggle">
        <button type="button" id="typeApp" class="glass sel"><svg class="icon"><use href="#ic-smartphone"/></svg> Aplikacja</button>
        <button type="button" id="typeSite" class="glass"><svg class="icon"><use href="#ic-globe"/></svg> Strona</button>
      </div>
    </div>
    <div class="field">
      <label>Nazwa</label>
      <input id="inpName" type="text" placeholder="np. Kalkulator kalorii" maxlength="60">
    </div>
    <div class="field">
      <label>Adres URL</label>
      <input id="inpUrl" type="text" placeholder="https://...">
    </div>
    <div class="field">
      <label>Ikonka</label>
      <div class="icon-row" id="iconRow"></div>
    </div>
    <button class="save-btn glass" id="saveBtn"><svg class="icon"><use href="#ic-save"/></svg> Zapisz projekt</button>
    <button class="cancel-link" id="cancelBtn">Anuluj</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom">
  <button class="nav-item active" data-nav="all"><svg class="icon"><use href="#ic-grid"/></svg>Wszystko</button>
  <button class="nav-item" data-nav="app"><svg class="icon"><use href="#ic-smartphone"/></svg>Aplikacje</button>
  <button class="fab" id="addFab"><svg class="icon"><use href="#ic-plus"/></svg></button>
  <button class="nav-item" data-nav="site"><svg class="icon"><use href="#ic-globe"/></svg>Strony</button>
  <button class="nav-item" data-nav="settings"><svg class="icon"><use href="#ic-more"/></svg>Więcej</button>
</nav>

<script>
const STORAGE_KEY = 'moje-projekty-v1';
const ICONS = ['ic-box','ic-star','ic-zap','ic-cart','ic-camera','ic-calendar','ic-message','ic-music','ic-home','ic-tool','ic-image','ic-cpu','ic-heart','ic-gamepad','ic-chart','ic-rocket'];

let state = { tab:'all', pickedType:'app', pickedIcon:'ic-box' };

function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const list = JSON.parse(raw);
      // migracja starych wpisów z emoji na ikony SVG
      return list.map(p=>({ ...p, icon: p.icon || 'ic-box' }));
    }
  }catch(e){}
  // domyślne przykładowe projekty - podmień lub usuń
  return [];
}
function saveProjects(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
let projects = loadProjects();

function iconSvg(name, size){
  return `<svg class="icon" width="${size||24}" height="${size||24}"><use href="#${name}"/></svg>`;
}

function render(){
  const content = document.getElementById('content');
  const filtered = state.tab === 'all' ? projects : projects.filter(p=>p.type===state.tab);

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  document.querySelectorAll('.nav-item[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav===state.tab));

  if(filtered.length === 0){
    content.innerHTML = `<div class="empty"><div class="big">${iconSvg('ic-inbox',30)}</div>Brak projektów w tej kategorii.<br>Dodaj pierwszy klikając <b>+</b> na dole.</div>`;
    return;
  }

  const groups = state.tab === 'all'
    ? [['Aplikacje','app','ic-smartphone'], ['Strony','site','ic-globe']]
    : [[state.tab==='app'?'Aplikacje':'Strony', state.tab, state.tab==='app'?'ic-smartphone':'ic-globe']];

  let html = '';
  groups.forEach(([label,type,labelIcon])=>{
    const items = filtered.filter(p=>p.type===type);
    if(items.length===0) return;
    html += `<div class="section-label">${iconSvg(labelIcon,14)}${label}</div><div class="grid">`;
    items.forEach((p,idx)=>{
      html += `
        <div class="card ${p.type}" role="link" tabindex="0" data-url="${escapeAttr(p.url)}" style="animation-delay:${idx*0.03}s">
          <button class="del" type="button" data-id="${p.id}" aria-label="Usuń projekt">${iconSvg('ic-x',13)}</button>
          <div class="icon-wrap">${iconSvg(p.icon,22)}</div>
          <div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="cat">${p.type==='app'?'Aplikacja':'Strona'}</div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html;

  content.querySelectorAll('.card').forEach(card=>{
    const open = ()=>window.open(card.dataset.url, '_blank', 'noopener');
    card.addEventListener('click', open);
    card.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
  });
  content.querySelectorAll('.card .del').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); removeProject(btn.dataset.id); });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function removeProject(id){
  if(!confirm('Usunąć ten projekt?')) return;
  projects = projects.filter(p=>p.id!==id);
  saveProjects(projects);
  render();
  showToast('Projekt usunięty');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = `${iconSvg('ic-check',15)}<span></span>`;
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; render(); });
});
document.querySelectorAll('.nav-item[data-nav]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.nav === 'settings'){
      if(confirm('Wyczyścić WSZYSTKIE projekty? Tej operacji nie można cofnąć.')){
        projects = []; saveProjects(projects); render();
      }
      return;
    }
    state.tab = btn.dataset.nav; render();
  });
});

// Modal logic
const overlay = document.getElementById('overlay');
const iconRow = document.getElementById('iconRow');
ICONS.forEach(name=>{
  const b = document.createElement('button');
  b.type='button';
  b.className='glass';
  b.innerHTML = iconSvg(name,20);
  if(name===state.pickedIcon) b.classList.add('sel');
  b.addEventListener('click', ()=>{
    state.pickedIcon = name;
    iconRow.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
  iconRow.appendChild(b);
});

document.getElementById('addFab').addEventListener('click', openModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.getElementById('typeApp').addEventListener('click', ()=>{
  state.pickedType='app';
  document.getElementById('typeApp').classList.add('sel');
  document.getElementById('typeSite').classList.remove('sel');
});
document.getElementById('typeSite').addEventListener('click', ()=>{
  state.pickedType='site';
  document.getElementById('typeSite').classList.add('sel');
  document.getElementById('typeApp').classList.remove('sel');
});

function openModal(){
  document.getElementById('inpName').value='';
  document.getElementById('inpUrl').value='';
  state.pickedType='app'; state.pickedIcon='ic-box';
  document.getElementById('typeApp').classList.add('sel');
  document.getElementById('typeSite').classList.remove('sel');
  iconRow.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
  iconRow.querySelector('button').classList.add('sel');
  overlay.classList.add('show');
  setTimeout(()=>document.getElementById('inpName').focus(), 200);
}
function closeModal(){ overlay.classList.remove('show'); }

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('inpName').value.trim();
  let url = document.getElementById('inpUrl').value.trim();
  if(!name){ showToast('Podaj nazwę projektu'); return; }
  if(!url){ showToast('Podaj adres URL'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const proj = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    name, url,
    type: state.pickedType,
    icon: state.pickedIcon
  };
  projects.push(proj);
  saveProjects(projects);
  closeModal();
  state.tab = state.tab==='settings' ? 'all' : state.tab;
  render();
  showToast('Projekt dodany');
});

render();
</script>
</body>
</html>
